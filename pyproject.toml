[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-kv-cache"
version = "0.1.0"
description = "Memory-bounded article KV caching for QuALITY"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.6.0",
  "transformers==4.48.3",
  "accelerate==1.3.0",
  "huggingface-hub==0.28.1",
  "safetensors==0.5.2",
  "numpy==1.26.4",
  "matplotlib==3.9.4",
  "psutil==6.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
